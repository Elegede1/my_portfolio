{% extends 'admin/base.html' %}

{% block head_tail %}
    {{ super() }}
    <link href="{{ url_for('static', filename='css/styles.min.css') }}" rel="stylesheet">
{% endblock %}

{% block tail %}
    {{ super() }}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const body = document.body;
            
            // Check for existing dark mode toggle in navbar
            const existingToggle = document.getElementById('adminDarkModeToggle');
            if (existingToggle) {
                return; // Already exists
            }

            // Create the toggle button element
            const toggleLi = document.createElement('li');
            toggleLi.className = 'nav-item';
            toggleLi.innerHTML = `
                <a class="nav-link" id="adminDarkModeToggle" title="Toggle Dark Mode" style="cursor: pointer; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-moon-stars"></i>
                </a>
            `;
            
            // Find the navbar and inject it
            const navbars = document.querySelectorAll('.navbar-nav');
            if (navbars.length > 0) {
                // Append to the last .navbar-nav found (often the right side one)
                navbars[navbars.length - 1].appendChild(toggleLi);
            }

            const toggle = document.getElementById('adminDarkModeToggle');
            
            // Check saved preference
            if (localStorage.getItem('darkMode') === 'enabled') {
                body.classList.add('dark-mode');
                if (toggle) toggle.innerHTML = '<i class="bi bi-sun"></i>';
            }

            if (toggle) {
                toggle.addEventListener('click', function() {
                    body.classList.toggle('dark-mode');
                    
                    if (body.classList.contains('dark-mode')) {
                        localStorage.setItem('darkMode', 'enabled');
                        toggle.innerHTML = '<i class="bi bi-sun"></i>';
                    } else {
                        localStorage.setItem('darkMode', 'disabled');
                        toggle.innerHTML = '<i class="bi bi-moon-stars"></i>';
                    }
                });
            }
        });
    </script>
{% endblock %}
