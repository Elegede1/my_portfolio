<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Jekuthiel Okafor - Portfolio" />
        <meta name="author" content="Jekuthiel Okafor" />
        <title>{% block title %}Jekuthiel Okafor - Portfolio{% endblock %}</title>

        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='assets/favicon.ico') }}" />

        <!-- Preconnect to external domains -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://cdn.jsdelivr.net" />

        <!-- Custom Google Font - loaded asynchronously -->
        <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
        <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" /></noscript>

        <!-- Bootstrap Icons - loaded asynchronously -->
        <link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" onload="this.onload=null;this.rel='stylesheet'" />
        <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" /></noscript>

        <!-- Core theme CSS (minimal, no Bootstrap) -->
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.min.css') }}" />
    </head>
    <body class="d-flex flex-column h-100">

        <main class="flex-shrink-0">
            <!-- Navigation -->
            <nav class="navbar navbar-expand-lg navbar-light py-3">
                <div class="container px-5">
                    <a class="navbar-brand me-3" href="{{ url_for('index') }}"><span class="fw-bolder text-primary">Jekuthiel Okafor</span></a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0 small fw-bolder">
                            <li class="nav-item"><a class="nav-link px-3" href="{{ url_for('index') }}">Home</a></li>
                            <li class="nav-item"><a class="nav-link px-3" href="{{ url_for('resume') }}">Resume</a></li>
                            <li class="nav-item"><a class="nav-link px-3" href="{{ url_for('projects') }}">Projects</a></li>
                            <li class="nav-item"><a class="nav-link px-3" href="{{ url_for('contact') }}">Contact</a></li>
                        </ul>
                        <button class="btn btn-outline-dark btn-sm me-2" id="darkModeToggle" aria-label="Toggle dark mode">
                            <i class="bi bi-moon-stars"></i>
                        </button>
                    </div>
                </div>
            </nav>
        </main>

        {% block content %}
        {% endblock %}

        <footer class="bg-white py-4 mt-auto">
            <div class="container px-5">
                <div class="row align-items-center justify-content-between flex-column flex-sm-row">
                    <div class="col-auto"><div class="small m-0">Copyright &copy; Jekuthiel Okafor {{ year }}</div></div>
                    <div class="col-auto">
                        <a class="small" href="{{ url_for('contact') }}">Contact</a>
                    </div>
                </div>
            </div>
        </footer>

        <!-- Bootstrap core JS - loaded asynchronously -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
        <!-- Core theme JS -->
        <script src="{{ url_for('static', filename='js/scripts.js') }}" defer></script>
    </body>
</html>
